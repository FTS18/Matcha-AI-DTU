name: Community Support

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, ready_for_review, synchronized]
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  community:
    name: Matcha AI Community Support
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Pull Request Support ---
      - name: Welcome New Contributors
        if: github.event_name == 'pull_request_target'
        uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          pr_message: "## Welcome to Matcha AI! Thanks for your contribution."

      - name: PR Labeler
        if: github.event_name == 'pull_request_target'
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml

      # --- Repository Maintenance ---
      - name: Stale Issue Manager
        if: github.event_name == 'schedule'
        uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Drafter
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wiki Documentation Sync
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          WIKI_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"
          git clone "$WIKI_URL" wiki_repo
          cp -R docs/* wiki_repo/
          cd wiki_repo
          git add .
          if ! git diff --staged --quiet; then git commit -m "docs: sync [skip ci]"; git push origin $(git branch --show-current); fi
