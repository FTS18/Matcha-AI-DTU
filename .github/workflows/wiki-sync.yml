name: Wiki Sync

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync to GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Setup git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Clone the wiki repository
          # Using GITHUB_TOKEN for authentication
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          git clone "$WIKI_URL" wiki_repo

          # 3. Copy files from docs/ to wiki_repo/
          # We use rsync-like behavior or just cp. 
          # Since docs/ is flat, a simple cp works.
          # If we want to map a file to 'Home.md', we can do that here.
          cp -R docs/* wiki_repo/
          
          # Optional: Map a main doc to Home.md if it doesn't exist
          if [ ! -f "wiki_repo/Home.md" ]; then
            # Use README.md from root as Home.md or pick one from docs/
            cp README.md wiki_repo/Home.md
          fi

          # 4. Commit and Push
          cd wiki_repo
          git add .
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "docs: automatic sync from docs/ directory [skip ci]"
            # Wikis use 'master' or 'main' depending on when they were created. 
            # We try both or check the current branch.
            CURRENT_BRANCH=$(git branch --show-current)
            git push origin "$CURRENT_BRANCH"
          fi
