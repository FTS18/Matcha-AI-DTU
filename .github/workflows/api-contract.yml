name: API Contract & Types Consistency

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Shared Contracts
        run: npx turbo run build --filter=@matcha/contracts

      - name: Verify Consumer Compatibility
        run: |
          # This ensures that both Web and Orchestrator can compile against the current contracts.
          # If a breaking change was made to the contract, one of these will fail.
          npx turbo run build --filter=web --filter=orchestrator --dry
          echo "API Contract is consistent across frontend and backend."
