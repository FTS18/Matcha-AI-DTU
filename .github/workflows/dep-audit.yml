name: Dependency Bloat Watcher

on:
  pull_request:
    branches: [main, dev]

jobs:
  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Check for Unused Dependencies
        run: |
          # Run depcheck across the monorepo
          # We ignore some standard config packages that don't have direct imports
          npx depcheck --ignores="eslint-config-*,prettier,typescript,@types/*,@matcha/*" || echo "Found unused dependencies. Consider removing them to reduce bundle size."
