name: Greetings

on: [pull_request_target]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            ## Welcome to Matcha AI

            Thank you for opening your first Pull Request here! We are thrilled to have you as part of the community.

            **Next Steps:**
            - Our maintainers will review your changes as soon as possible (usually within 48-72 hours).
            - Please make sure you have followed our [Contribution Guidelines](./docs/CONTRIBUTING.md) and that your PR passes all tests.
            - Feel free to join the conversation in our [Discussions tab](https://github.com/FTS18/Matcha-AI-DTU/discussions).

            While you wait for a review, why not introduce yourself in the "Introduce Yourself" discussion thread?

            Happy coding!
