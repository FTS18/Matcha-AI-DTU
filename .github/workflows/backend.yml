name: API & Database

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  integrity:
    name: Integrity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # --- Step 1: API Contract Check ---
      - name: Verify API Consumer Compatibility
        run: |
          npx turbo run build --filter=@matcha/contracts
          npx turbo run build --filter=web --filter=orchestrator --dry
          echo "API Contract is consistent."

      # --- Step 2: Prisma & DB Check ---
      - name: Validate Prisma Schema
        run: npx prisma validate --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://dummy@localhost:5432/dummy"

      - name: SQL Migration Safety Audit
        run: |
          DANGEROUS_OPS=$(grep -rE "DROP COLUMN|DROP TABLE|TRUNCATE" packages/database/prisma/migrations/*.sql 2>/dev/null || true)
          if [ -n "$DANGEROUS_OPS" ]; then
            echo "::warning title=Dangerous Migration Detected::Destructive operations found."
          fi

      # --- Step 3: Env Sync Check ---
      - name: Verify Env Example Consistency
        run: |
          get_keys() { grep -v '^#' "$1" | grep '=' | cut -d'=' -f1 | sed 's/ //g' | sort | uniq; }
          ROOT_KEYS=$(get_keys .env.example)
          for KEY in GEMINI_API_KEY HF_TOKEN; do
            if ! echo "$ROOT_KEYS" | grep -q "$KEY"; then
              echo "::error::Key $KEY missing from root .env.example"
              exit 1
            fi
          done
