name: CI, BUILD, DOCS

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  core:
    name: Core Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Linting Tools
        run: pip install black
      
      - name: Install & Build
        run: |
          npm ci
          npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          GEMINI_API_KEY: "dummy"
          NEXT_PUBLIC_API_URL: "http://localhost:4000"
      
      - name: Lint Codebase
        run: npm run lint

      - name: Documentation Link Check
        run: |
          find . -name "*.md" -not -path "*/node_modules/*" -not -path "*/venv/*" -not -path "*/.next/*" -not -path "*/.turbo/*" -not -path "*/dist/*" | xargs -n 1 npx markdown-link-check -q -c .github/linters/mlc_config.json

  registry:
    name: Container Registry
    needs: core
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Orchestrator
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/orchestrator/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/matcha-orchestrator:latest
            ghcr.io/${{ github.repository_owner }}/matcha-orchestrator:${{ github.sha }}

      - name: Build and Push Inference
        uses: docker/build-push-action@v5
        with:
          context: services/inference
          file: services/inference/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/matcha-inference:latest
            ghcr.io/${{ github.repository_owner }}/matcha-inference:${{ github.sha }}
