name: CI, BUILD, DOCS

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REPO_OWNER_LOWER: ""

on:
  push:
    branches: [main, dev]
    # Ignore changes to documentation and non-code files
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      inference: ${{ steps.filter.outputs.inference }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            orchestrator:
              - 'services/orchestrator/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
            inference:
              - 'services/inference/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
            mobile:
              - 'apps/mobile/**'
              - 'packages/**'
            shared:
              - 'packages/**'

  core:
    name: Core Engine
    needs: changes
    if: needs.changes.outputs.orchestrator == 'true' || needs.changes.outputs.inference == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Linting Tools
        run: pip install black
      
      - name: Install & Build
        run: |
          npm ci
          npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          GEMINI_API_KEY: "dummy"
          NEXT_PUBLIC_API_URL: "http://localhost:4000"
      
      - name: Lint Codebase
        run: npm run lint

      - name: Documentation Link Check
        run: |
          find . -name "*.md" -not -path "*/node_modules/*" -not -path "*/venv/*" -not -path "*/.next/*" -not -path "*/.turbo/*" -not -path "*/dist/*" | xargs -n 1 npx markdown-link-check -q -c .github/linters/mlc_config.json

  database-migration:
    name: Database Migration (Dry Run)
    needs: [core, changes]
    if: needs.changes.outputs.orchestrator == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Validate Schema and Generate Client
        run: |
          npx prisma validate --schema=packages/database/prisma/schema.prisma
          npx prisma generate --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://dummy@localhost:5432/dummy"

  registry-orchestrator:
    name: Container Registry (Orchestrator)
    needs: [core, changes, database-migration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.orchestrator == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        run: |
          echo "REPO_OWNER_LOWER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Orchestrator
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/orchestrator/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/matcha-orchestrator:latest
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/matcha-orchestrator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  registry-inference:
    name: Container Registry (Inference)
    needs: [core, changes, database-migration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.inference == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        run: |
          echo "REPO_OWNER_LOWER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Inference
        uses: docker/build-push-action@v5
        with:
          context: services/inference
          file: services/inference/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/matcha-inference:latest
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/matcha-inference:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
