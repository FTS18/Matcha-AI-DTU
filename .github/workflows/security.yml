name: Security, Compliance & Licenses

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  security:
    name: Guardian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Step 1: Secret Scanning ---
      - name: Detect Committed Env Files
        run: |
          DOTENV_FILES=$(find . -name ".env" -not -path "*/node_modules/*")
          if [ -n "$DOTENV_FILES" ]; then exit 1; fi

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Step 2: License Audit ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Audit Open Source Licenses
        run: |
          npm install --legacy-peer-deps
          npx license-checker --summary --failOn "AGPL;GPL;LGPL" || echo "License check finished."

  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
