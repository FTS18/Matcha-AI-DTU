# Dependabot configuration for Matcha AI (Hardened & Quiet Mode)
version: 2
updates:
  # Maintain dependencies for npm (Next.js, NestJS, shared packages)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "chore"

  # Maintain dependencies for pip (FastAPI / Inference service)
  - package-ecosystem: "pip"
    directory: "/services/inference"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "chore"

  # Maintain GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "chore"
