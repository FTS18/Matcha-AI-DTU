services:
  postgres:
    image: postgres:16-alpine
    container_name: matcha_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matcha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matcha_password}
      POSTGRES_DB: ${POSTGRES_DB:-matcha_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U matcha_user -d matcha_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: matcha_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: matcha_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-matcha_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-matcha_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: matcha_orchestrator
    restart: unless-stopped
    init: true
    environment:
      - DATABASE_URL=postgresql://matcha_user:matcha_password@postgres:5432/matcha_db?schema=public
      - INFERENCE_URL=http://inference:8000
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-super_secret_matcha_key}
    ports:
      - "4000:4000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  inference:
    build:
      context: services/inference
      dockerfile: Dockerfile
    container_name: matcha_inference
    restart: unless-stopped
    init: true
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:4000
      - REDIS_URL=redis://redis:6379
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/inference/models:/app/models
      - ./uploads:/app/uploads
    # GPU support (optional, commented out by default)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  postgres_data:
  redis_data:
  minio_data:
